      - name: card_product
        description: "{{ doc('col__card_product') }}"
      - name: card_scheme
        description: "{{ doc('col__card_scheme') }}"
      - name: card_bin
        description: "{{ doc('col__card_bin') }}"
      - name: has_invalid_card_bin
        description: "{{ doc('col__has_invalid_card_bin') }}"
      - name: card_last_4_raw
        description: "{{ doc('col__card_last_4_raw') }}"
      - name: has_usable_card_last_4
